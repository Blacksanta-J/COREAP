<script>
    document.addEventListener('DOMContentLoaded', function () {
        initInfoModal();
    });

    const INFO_AREAS = [
        {

            titulo: "Paso común",
            html: `<h4>Qué hace el Elevador en todos los casos</h4>
            <ol>

                <li>Identifica el área <strong>solo con la columna AREA</strong> de los datos.</li>
                <li>Controla <strong>BASE/ASCENSO</strong>: en la mayoría de las áreas solo procesa <strong>Base</strong>. Media, Técnica, Artística, Normales y Secundaria Adultos procesan <strong>Base y Ascenso</strong>.</li>
                <li>Elimina solo las filas con fondo rojo exacto (#FF0000, #8B0000, #800000, #DC143C, #B22222, #CD5C5C, #F08080, #FA8072, #FF6347, #FF4500), excepto en Especial y Servicios Profesionales.</li>
                <li>Completa horas, horario a cumplir, docente, motivo y fechas de publicación/apertura/hasta.</li>
                <li>Ordena por código de cargo de mayor a menor (salvo cuando el área reordena Ascenso y después Base).</li>
                <li>Descarga un Excel con los datos procesados.</li>
            </ol>
            <p class="nota">Si el AREA no está automatizada, muestra: TODAVIA NO TENEMOS ESTA AREA AUTOMATIZADA.</p>`
        },
        {
            id: "inicial",
            titulo: "Educación Inicial",
            html: `<h4>AREA = EDUCACION INICIAL</h4>
            <ol>
                <li>Pide si querés la variante <strong>Mañana</strong> o <strong>Tarde</strong>.</li>
                <li>Deja solo los turnos de esa variante (Doble se convierte en Completo).</li>
                <li>Publicación: <strong>09:30</strong> (mañana) o <strong>13:00</strong> (tarde).</li>
                <li>Apertura según cargo y turno: 1010/1018 a las 11:00, 11:15, 11:30, 11:45 (mañana) o 15:00, 15:15, 15:30, 15:45 (tarde).</li>
                <li>Novedad mayor a 60 días: 1 si turno Completo e INTERINO; 2 en mañana/tarde; si ya venía 1 se respeta.</li>
            </ol>`
        },
        {
            id: "primaria",
            titulo: "Educación Primaria",
            html: `<h4>AREA = EDUCACION PRIMARIA</h4>
            <ol>
                <li>Pide variante <strong>Mañana</strong> o <strong>Tarde</strong>.</li>
                <li>Deja solo cargos <strong>1020</strong> y <strong>1028</strong> del turno elegido.</li>
                <li>Publicación: <strong>08:00</strong> (mañana) o <strong>12:00</strong> (tarde).</li>
                <li>Apertura mañana: 1020 a las 09:30 y 1028 a las 09:45. Tarde: 1020 a las 13:00 y 1028 a las 13:15.</li>
                <li>Novedad: misma regla que Inicial (Completo + INTERINO = 1, mañana/tarde = 2).</li>
            </ol>`
        },
        {
            id: "curricular",
            titulo: "Curricular",
            html: `<h4>AREA = CURRICULAR</h4>
            <ol>
                <li>Pide la <strong>tabla de equivalencias</strong> (espejado de cargos).</li>
                <li>Reemplaza códigos de cargo y marca <strong>CONTROLAR</strong> si el cargo no está en la tabla.</li>

                <li>Novedad: <strong>1</strong> si Cant. Horas es 32; si no, <strong>2</strong>.</li>
                <li>Publicación <strong>10:00</strong>. Apertura desde <strong>18:00</strong>, de a 10 minutos por código de cargo.</li>
            </ol>`
        },
        {
            id: "especial",
            titulo: "Especial",
            html: `<h4>AREA = ESPECIAL</h4>
            <ol>
                <li>Usa las mismas reglas de Curricular (equivalencias, CONTROLAR, vaciar asignatura/especialidad).</li>
                <li><strong>No elimina</strong> las vacantes pintadas de rojo.</li>
                <li>Si Distrito está vacío o es 0, lo pasa a <strong>1</strong>.</li>
                <li>Novedad queda en <strong>2</strong>.</li>
                <li>Publicación 10:00. Apertura desde 18:00, de a 10 minutos por cargo.</li>
            </ol>`
        },
        {
            id: "servicios",
            titulo: "Servicios Profesionales",
            html: `<h4>AREA = SERVICIOS PROFESIONALES</h4>
            <ol>
                <li>No pide tabla de equivalencias. Deja el código de cargo como viene.</li>
                <li>Vacía asignatura y especialidad.</li>
                <li><strong>No elimina</strong> las vacantes pintadas de rojo.</li>

                <li>Publicación 10:00. Apertura fija a las <strong>16:00</strong>.</li>
            </ol>`
        },
        {
            id: "primaria-adultos",
            titulo: "Primaria Adultos",
            html: `<h4>AREA = PRIMARIA ADULTOS</h4>
            <ol>
                <li>Pide hora de <strong>publicación</strong> y comienzo de <strong>apertura</strong>.</li>
                <li>Recodifica cargos <strong>1081 → 1080</strong> y <strong>691 → 904</strong>.</li>
                <li>Vacía asignatura y especialidad.</li>
                <li>Novedad queda en <strong>2</strong>.</li>
                <li>Apertura: el horario que cargaste y el resto de cargos se corre de a <strong>10 minutos</strong>.</li>
            </ol>`
        },
        {
            id: "media",
            titulo: "Media / Técnica / Artística",
            html: `<h4>AREA = MEDIA, TECNICA o ARTISTICA</h4>
            <ol>
                <li>Procesa <strong>Base y Ascenso</strong>.</li>
                <li>Pide el <strong>catálogo de combinaciones</strong> (una hoja: CODIGO CARGO, CODIGO ASIGNATURA, CODIGO ESPECIALIDAD). La coincidencia es exacta.</li>
                <li>Lo que no matchea va a la hoja <strong>Sin coincidencia</strong>.</li>
                <li>Publicación <strong>10:00</strong>. Apertura desde <strong>18:00</strong>, de a 5 minutos por combinación, primero Ascenso y después Base.</li>
                <li>Cargo <strong>1582</strong>: publicación 16:00 y apertura desde 19:30 (también de a 5 minutos).</li>
                <li>Novedad queda en <strong>2</strong>. No recodifica 1081 ni 691.</li>
            </ol>`
        },
        {
            id: "normales",
            titulo: "Normales",
            html: `<h4>AREA = NORMALES</h4>
            <ol>
                <li>Copia el esquema de Media (Base y Ascenso, novedad 2) pero <strong>sin catálogo</strong>.</li>
                <li>Pide hora de publicación y comienzo de apertura, como Primaria Adultos.</li>
                <li>Apertura: primero Ascenso y después Base, corriendo de a <strong>5 minutos</strong> por código de cargo.</li>
            </ol>`
        },
        {
            id: "sec-adultos",
            titulo: "Secundaria Adultos",
            html: `<h4>AREA = SECUNDARIA ADULTOS</h4>
            <ol>
                <li>Mismas reglas que <strong>Normales</strong> (Base y Ascenso, popup de horarios, apertura de a 5 minutos, sin catálogo).</li>
                <li>Si CODIGO ASIGNATURA es 1598, 3422, 4835, 5620, 6015, 6095, 6099, 6107, 6116, 6125, 6152, 6169 o 6229, pone <strong>1081</strong> en CODIGO ESPECIALIDAD.</li>
            </ol>`
        }
    ];

    function mostrarInfoArea(id) {
        const item = INFO_AREAS.find(a => a.id === id) || INFO_AREAS[0];
        document.getElementById('infoContent').innerHTML = item.html;
        document.querySelectorAll('#infoNav button').forEach(b => {
            b.classList.toggle('active', b.dataset.id === item.id);
        });
    }

    function initInfoModal() {
        const overlay = document.getElementById('infoOverlay');
        const nav = document.getElementById('infoNav');
        if (!overlay || !nav) return;
        nav.innerHTML = INFO_AREAS.map(a => '<button type="button" data-id="' + a.id + '">' + a.titulo + '</button>').join('');
        nav.addEventListener('click', function (e) {
            const btn = e.target.closest('button');
            if (btn) mostrarInfoArea(btn.dataset.id);
        });
        const abrir = () => {
            overlay.classList.add('visible');
            mostrarInfoArea('general');
        };
        const cerrar = () => overlay.classList.remove('visible');
        document.getElementById('infoBtn').addEventListener('click', abrir);
        document.getElementById('infoClose').addEventListener('click', cerrar);
        overlay.addEventListener('click', function (e) {
            if (e.target === overlay) cerrar();
        });
    }

    function getExcelDate(year, month, day) {
        const utc = Date.UTC(year, month, day);
        return (utc / 86400000) + 25569;
    }

    function readFileAsync(file) {
        return new Promise((resolve, reject) => {
            let reader = new FileReader();
            reader.onload = e => resolve(new Uint8Array(e.target.result));
            reader.onerror = reject;
            reader.readAsArrayBuffer(file);
        });
    }

    function decodeXml(value) {
        return String(value || "")
            .replace(/&amp;/g, "&")
            .replace(/&lt;/g, "<")
            .replace(/&gt;/g, ">")
            .replace(/&quot;/g, '"')
            .replace(/&#39;/g, "'");
    }

    function parseXmlAttrs(tag) {
        const attrs = {};
        const re = /([:\w]+)\s*=\s*"([^"]*)"/g;
        let match;
        while ((match = re.exec(tag))) {
            attrs[match[1]] = decodeXml(match[2]);
        }
        return attrs;
    }

    function xmlBlocks(xml, tag) {
        const re = new RegExp("<(?:\\w+:)?" + tag + "\\b[^>]*>([\\s\\S]*?)</(?:\\w+:)?" + tag + ">", "g");
        const out = [];
        let match;
        while ((match = re.exec(xml))) out.push(match[1]);
        return out;
    }

    function xmlTags(xml, tag) {
        const re = new RegExp("<(?:\\w+:)?" + tag + "\\b[^>]*\\/?>", "g");
        return xml.match(re) || [];
    }

    /* Solo se eliminan vacantes con estos fondos (hex exacto). */
    var FONDOS_ROJO_ELIMINAR = {
      'FF0000': true,
      '8B0000': true,
      '800000': true,
      'DC143C': true,
      'B22222': true,
      'CD5C5C': true,
      'F08080': true,
      'FA8072': true,
      'FF6347': true,
      'FF4500': true
    };

    var NOMBRES_ROJO_ELIMINAR = {
      red: 'FF0000',
      darkred: '8B0000',
      maroon: '800000',
      crimson: 'DC143C',
      firebrick: 'B22222',
      indianred: 'CD5C5C',
      lightcoral: 'F08080',
      salmon: 'FA8072',
      tomato: 'FF6347',
      orangered: 'FF4500'
    };

    /* Indexed color 2 del palette estándar Excel = #FF0000 */
    var INDEXED_ROJO_ELIMINAR = { 2: 'FF0000' };

    function applyTint(hex, tint) {
        tint = Number(tint);
        if (!hex || !tint) return hex;
        const apply = (c) => tint < 0 ? Math.round(c * (1 + tint)) : Math.round(c * (1 - tint) + 255 * tint);
        const to = (v) => Math.max(0, Math.min(255, v)).toString(16).padStart(2, "0").toUpperCase();
        const r = parseInt(hex.slice(0, 2), 16);
        const g = parseInt(hex.slice(2, 4), 16);
        const b = parseInt(hex.slice(4, 6), 16);
        return to(apply(r)) + to(apply(g)) + to(apply(b));
    }

    function rgbChannels(hex) {
        if (!hex) return null;
        let value = String(hex).replace("#", "").toUpperCase();
        if (value.length === 8) value = value.slice(2);
        if (value.length !== 6 || /[^0-9A-F]/.test(value)) return null;
        return {
            hex: value,
            r: parseInt(value.slice(0, 2), 16),
            g: parseInt(value.slice(2, 4), 16),
            b: parseInt(value.slice(4, 6), 16)
        };
    }

    function hexEsFondoRojoEliminar(hex) {
        const ch = rgbChannels(hex);
        return !!(ch && FONDOS_ROJO_ELIMINAR[ch.hex]);
    }

    function rgbEsFondoRojoEliminar(r, g, b) {
        const to = (v) => Math.max(0, Math.min(255, Number(v) || 0)).toString(16).padStart(2, "0").toUpperCase();
        return !!FONDOS_ROJO_ELIMINAR[to(r) + to(g) + to(b)];
    }

    function colorAttrsAreRed(attrs, themeColors) {
        if (!attrs) return false;
        const indexed = attrs.indexed != null ? Number(attrs.indexed) : NaN;
        if (!isNaN(indexed) && INDEXED_ROJO_ELIMINAR[indexed]) {
            return hexEsFondoRojoEliminar(INDEXED_ROJO_ELIMINAR[indexed]);
        }
        let hex = null;
        if (attrs.rgb) {
            const ch = rgbChannels(attrs.rgb);
            hex = ch && ch.hex;
        } else if (attrs.theme != null && themeColors && themeColors[Number(attrs.theme)]) {
            hex = themeColors[Number(attrs.theme)];
        }
        if (!hex) return false;
        hex = applyTint(hex, attrs.tint);
        return hexEsFondoRojoEliminar(hex);
    }

    function sheetJsColorIsRed(color) {
        if (!color) return false;
        if (typeof color === "string") {
            return hexEsFondoRojoEliminar(color);
        }
        return colorAttrsAreRed(color, null);
    }

    function sheetJsCellIsRed(cell) {
        if (!cell || !cell.s || typeof cell.s !== "object") return false;
        const style = cell.s;
        const fill = style.fill || {};
        /* Solo fondo de celda (no color de fuente/texto). */
        const colors = [
            style.fgColor, style.bgColor,
            fill.fgColor, fill.bgColor,
            fill.fgColor && fill.fgColor.rgb, fill.bgColor && fill.bgColor.rgb
        ];
        return colors.some(sheetJsColorIsRed);
    }

    async function inflateRaw(compressed) {
        const ds = new DecompressionStream("deflate-raw");
        const ab = await new Response(new Blob([compressed]).stream().pipeThrough(ds)).arrayBuffer();
        return new Uint8Array(ab);
    }

    async function readZipTextFiles(u8) {
        const view = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
        let eocd = -1;
        const min = Math.max(0, u8.length - 65557);
        for (let i = u8.length - 22; i >= min; i--) {
            if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
        }
        if (eocd < 0) return null;
        const count = view.getUint16(eocd + 10, true);
        const cdOffset = view.getUint32(eocd + 16, true);
        const files = {};
        let off = cdOffset;
        const decoder = new TextDecoder("utf-8");
        for (let i = 0; i < count; i++) {
            if (view.getUint32(off, true) !== 0x02014b50) break;
            const method = view.getUint16(off + 10, true);
            const compSize = view.getUint32(off + 20, true);
            const nameLen = view.getUint16(off + 28, true);
            const extraLen = view.getUint16(off + 30, true);
            const commentLen = view.getUint16(off + 32, true);
            const localOff = view.getUint32(off + 42, true);
            const name = decoder.decode(u8.subarray(off + 46, off + 46 + nameLen)).replace(/\\/g, "/");
            const localNameLen = view.getUint16(localOff + 26, true);
            const localExtraLen = view.getUint16(localOff + 28, true);
            const dataStart = localOff + 30 + localNameLen + localExtraLen;
            const compressed = u8.subarray(dataStart, dataStart + compSize);
            let data;
            if (method === 0) data = compressed;
            else if (method === 8) data = await inflateRaw(compressed);
            else { off += 46 + nameLen + extraLen + commentLen; continue; }
            files[name] = decoder.decode(data);
            off += 46 + nameLen + extraLen + commentLen;
        }
        return files;
    }

    function zipGet(files, path) {
        const want = String(path || "").replace(/\\/g, "/").replace(/^\//, "").toLowerCase();
        const key = Object.keys(files).find(k => k.replace(/\\/g, "/").toLowerCase() === want);
        return key ? files[key] : "";
    }

    function parseThemeColors(themeXml) {
        const colors = [];
        if (!themeXml) return colors;
        const scheme = xmlBlocks(themeXml, "clrScheme")[0] || "";
        const vals = [];
        const colorRe = /<(?:a:)?(?:srgbClr|sysClr)\b[^>]*\/?>/g;
        let match;
        while ((match = colorRe.exec(scheme))) {
            const attrs = parseXmlAttrs(match[0]);
            const hex = rgbChannels(attrs.val || attrs.lastClr);
            if (hex) vals.push(hex.hex);
        }
        return vals;
    }

    function parseFillFromXml(fillXml, themeColors) {
        const fgTag = xmlTags(fillXml, "fgColor")[0];
        const bgTag = xmlTags(fillXml, "bgColor")[0];
        const pattern = (fillXml.match(/patternType="([^"]+)"/) || [])[1] || "";
        const fg = fgTag ? parseXmlAttrs(fgTag) : {};
        const bg = bgTag ? parseXmlAttrs(bgTag) : {};
        const isRed = pattern !== "none" && (colorAttrsAreRed(fg, themeColors) || colorAttrsAreRed(bg, themeColors));
        return { isRed };
    }

    function parseXfs(block) {
        return xmlTags(block || "", "xf").map(tag => {
            const attrs = parseXmlAttrs(tag);
            return {
                fillId: attrs.fillId != null ? Number(attrs.fillId) : 0,
                fontId: attrs.fontId != null ? Number(attrs.fontId) : 0,
                xfId: attrs.xfId != null ? Number(attrs.xfId) : 0,
                applyFill: attrs.applyFill,
                applyFont: attrs.applyFont
            };
        });
    }

    function markSqrefRows(sqref, redRows) {
        String(sqref || "").split(/\s+/).forEach(ref => {
            const m = ref.match(/[A-Z]+(\d+)(?::[A-Z]+(\d+))?/i);
            if (!m) return;
            const r1 = Number(m[1]);
            const r2 = Number(m[2] || m[1]);
            for (let r = r1; r <= r2; r++) redRows.add(r - 1);
        });
    }

    function cssColorIsRed(value) {
        if (!value) return false;
        const raw = String(value).trim().toLowerCase();
        if (NOMBRES_ROJO_ELIMINAR[raw]) {
            return hexEsFondoRojoEliminar(NOMBRES_ROJO_ELIMINAR[raw]);
        }
        const hexMatch = raw.match(/^#?([0-9a-f]{6}|[0-9a-f]{8})$/i);
        if (hexMatch) return hexEsFondoRojoEliminar(hexMatch[1]);
        const rgb = raw.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
        if (rgb) return rgbEsFondoRojoEliminar(Number(rgb[1]), Number(rgb[2]), Number(rgb[3]));
        return false;
    }

    function decodeWorkbookText(u8) {
        if (u8.length >= 2 && u8[0] === 0xFF && u8[1] === 0xFE) return new TextDecoder("utf-16le").decode(u8);
        if (u8.length >= 2 && u8[0] === 0xFE && u8[1] === 0xFF) return new TextDecoder("utf-16be").decode(u8);
        return new TextDecoder("utf-8").decode(u8);
    }

    function getRedRowsFromSpreadsheetML(xml) {
        const result = {};
        const styles = {};
        (xml.match(/<Style\b[\s\S]*?<\/Style>/gi) || []).forEach(block => {
            const id = (block.match(/\bss:ID="([^"]+)"/) || [])[1];
            if (!id) return;
            const interior = (block.match(/<Interior\b[^>]*>/i) || [])[0] || "";
            const color = (interior.match(/\bss:Color="([^"]+)"/) || [])[1];
            styles[id] = cssColorIsRed(color);
        });

        (xml.match(/<Worksheet\b[\s\S]*?<\/Worksheet>/gi) || []).forEach(sheetXml => {
            const name = decodeXml((sheetXml.match(/\bss:Name="([^"]+)"/) || [])[1] || "");
            const redRows = new Set();
            let excelRow = 0;
            const rows = sheetXml.match(/<Row\b[\s\S]*?<\/Row>/gi) || [];
            rows.forEach(rowXml => {
                const idx = rowXml.match(/\bss:Index="(\d+)"/);
                if (idx) excelRow = Number(idx[1]) - 1;
                const openTag = (rowXml.match(/<Row\b[^>]*>/i) || [])[0] || "";
                const rowStyle = (openTag.match(/\bss:StyleID="([^"]+)"/) || [])[1];
                let isRed = !!(rowStyle && styles[rowStyle]);
                (rowXml.match(/<Cell\b[^>]*>/gi) || []).forEach(cell => {
                    const sid = (cell.match(/\bss:StyleID="([^"]+)"/) || [])[1];
                    if (sid && styles[sid]) isRed = true;
                });
                if (isRed) redRows.add(excelRow);
                excelRow++;
            });
            result[name] = redRows;
        });
        return result;
    }

    function getRedRowsFromHtml(html) {
        const redClasses = new Set();
        const styleRe = /\.([A-Za-z0-9_-]+)\s*\{([^}]+)\}/g;
        let match;
        while ((match = styleRe.exec(html))) {
            const color = (match[2].match(/background(?:-color)?\s*:\s*([^;]+)/i) || [])[1];
            if (cssColorIsRed(color)) redClasses.add(match[1].toLowerCase());
        }

        const redRows = new Set();
        const trRe = /<tr\b([^>]*)>([\s\S]*?)<\/tr>/gi;
        let rowIndex = 0;
        let tr;
        while ((tr = trRe.exec(html))) {
            const attrs = tr[1] || "";
            const body = tr[2] || "";
            let isRed = false;
            const rowBg = (attrs.match(/bgcolor="([^"]+)"/i) || attrs.match(/background(?:-color)?\s*:\s*([^;"']+)/i) || [])[1];
            if (cssColorIsRed(rowBg)) isRed = true;
            const classRe = /class=["']([^"']+)["']/gi;
            let cls;
            while ((cls = classRe.exec(attrs + " " + body))) {
                String(cls[1]).split(/\s+/).forEach(name => {
                    if (redClasses.has(name.toLowerCase())) isRed = true;
                });
            }
            const tdBg = /(?:bgcolor="([^"]+)"|background(?:-color)?\s*:\s*([^;"')]+))/gi;
            let bg;
            while ((bg = tdBg.exec(body))) {
                if (cssColorIsRed(bg[1] || bg[2])) isRed = true;
            }
            if (isRed) redRows.add(rowIndex);
            rowIndex++;
        }
        return { "*": redRows };
    }

    async function getRedRowsBySheet(uint8) {
        const redRowsBySheet = {};
        let files = null;
        try {
            files = await readZipTextFiles(uint8);
        } catch (e) {
            files = null;
        }
        if (!files || !zipGet(files, "xl/styles.xml")) {
            const text = decodeWorkbookText(uint8);
            const head = text.slice(0, 4000);
            if (/urn:schemas-microsoft-com:office:spreadsheet|Excel\.Sheet|<Workbook\b/i.test(head)) {
                return getRedRowsFromSpreadsheetML(text);
            }
            if (/<html|<table|MIME-Version/i.test(head)) {
                return getRedRowsFromHtml(text);
            }
            return redRowsBySheet;
        }

        const stylesXml = zipGet(files, "xl/styles.xml");
        const wbXml = zipGet(files, "xl/workbook.xml");
        const relsXml = zipGet(files, "xl/_rels/workbook.xml.rels");
        if (!stylesXml || !wbXml || !relsXml) return redRowsBySheet;

        const themeKey = Object.keys(files).find(k => /xl\/theme\/theme\d+\.xml$/i.test(k.replace(/\\/g, "/")));
        const themeColors = parseThemeColors(themeKey ? files[themeKey] : "");

        const fills = [];
        xmlBlocks(stylesXml, "fills").forEach(block => {
            (block.match(/<(?:\w+:)?fill\b[\s\S]*?<\/(?:\w+:)?fill>/g) || []).forEach(fillXml => {
                fills.push(parseFillFromXml(fillXml, themeColors));
            });
        });

        const fontsAreRed = [];
        xmlBlocks(stylesXml, "fonts").forEach(block => {
            (block.match(/<(?:\w+:)?font\b[\s\S]*?<\/(?:\w+:)?font>/g) || []).forEach(fontXml => {
                const colorTag = xmlTags(fontXml, "color")[0];
                fontsAreRed.push(colorTag ? colorAttrsAreRed(parseXmlAttrs(colorTag), themeColors) : false);
            });
        });

        const dxfsAreRed = [];
        xmlBlocks(stylesXml, "dxfs").forEach(block => {
            (block.match(/<(?:\w+:)?dxf\b[\s\S]*?<\/(?:\w+:)?dxf>/g) || []).forEach(dxfXml => {
                const fillXml = (dxfXml.match(/<(?:\w+:)?fill\b[\s\S]*?<\/(?:\w+:)?fill>/) || [])[0] || "";
                const colorTag = xmlTags(dxfXml, "color")[0];
                dxfsAreRed.push(parseFillFromXml(fillXml, themeColors).isRed || (colorTag ? colorAttrsAreRed(parseXmlAttrs(colorTag), themeColors) : false));
            });
        });

        const cellStyleXfs = parseXfs(xmlBlocks(stylesXml, "cellStyleXfs")[0] || "");
        const cellXfs = parseXfs(xmlBlocks(stylesXml, "cellXfs")[0] || "");

        function styleIsRed(styleId) {
            const xf = cellXfs[styleId];
            if (!xf) return false;
            let fillId = xf.fillId;
            if ((xf.applyFill === "0" || xf.applyFill === "false") && cellStyleXfs[xf.xfId]) {
                fillId = cellStyleXfs[xf.xfId].fillId;
            }
            return !!(fills[fillId] && fills[fillId].isRed);
        }

        const ridToTarget = {};
        xmlTags(relsXml, "Relationship").forEach(tag => {
            const attrs = parseXmlAttrs(tag);
            let target = (attrs.Target || "").replace(/\\/g, "/");
            if (target && !target.startsWith("xl/")) target = "xl/" + target.replace(/^\//, "");
            if (attrs.Id) ridToTarget[attrs.Id] = target;
        });

        const sheets = [];
        xmlTags(wbXml, "sheet").forEach(tag => {
            const attrs = parseXmlAttrs(tag);
            const rid = attrs["r:id"] || attrs["r:Id"];
            sheets.push({ name: attrs.name, path: ridToTarget[rid] });
        });

        for (const sheet of sheets) {
            if (!sheet.path) continue;
            const sheetXml = zipGet(files, sheet.path);
            if (!sheetXml) continue;
            const redRows = new Set();

            xmlTags(sheetXml, "c").forEach(tag => {
                const attrs = parseXmlAttrs(tag);
                if (attrs.s == null || attrs.s === "") return;
                if (!styleIsRed(Number(attrs.s))) return;
                const rowMatch = (attrs.r || "").match(/(\d+)$/);
                if (rowMatch) redRows.add(Number(rowMatch[1]) - 1);
            });

            xmlTags(sheetXml, "row").forEach(tag => {
                const attrs = parseXmlAttrs(tag);
                if (attrs.s == null || attrs.s === "") return;
                if (!styleIsRed(Number(attrs.s))) return;
                if (attrs.r) redRows.add(Number(attrs.r) - 1);
            });

            (sheetXml.match(/<(?:\w+:)?conditionalFormatting\b[\s\S]*?<\/(?:\w+:)?conditionalFormatting>/g) || []).forEach(block => {
                const wrapAttrs = parseXmlAttrs(xmlTags(block, "conditionalFormatting")[0] || block);
                xmlTags(block, "cfRule").forEach(ruleTag => {
                    const rule = parseXmlAttrs(ruleTag);
                    if (rule.dxfId == null) return;
                    if (dxfsAreRed[Number(rule.dxfId)]) markSqrefRows(wrapAttrs.sqref, redRows);
                });
            });

            redRowsBySheet[sheet.name] = redRows;
        }

        return redRowsBySheet;
    }

    function cerrarModal() {
        document.getElementById('modalOverlay').classList.remove('visible');
        document.getElementById('modalTurnoFields').style.display = 'none';
        document.getElementById('modalEqFields').style.display = 'none';
        document.getElementById('modalHorariosFields').style.display = 'none';
        document.getElementById('modalConfirm').onclick = null;
        document.getElementById('modalCancel').onclick = null;
    }

    function parseHoraInput(value) {
        const match = String(value || "").trim().match(/^(\d{1,2}):(\d{2})/);
        if (!match) return null;
        const horas = Number(match[1]);
        const minutos = Number(match[2]);
        if (horas > 23 || minutos > 59) return null;
        const pad = (n) => String(n).padStart(2, "0");
        return {
            str: pad(horas) + ":" + pad(minutos),
            minutes: horas * 60 + minutos
        };
    }

    function normalizarNombreCol(nombre) {
        return String(nombre || "")
            .trim()
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/\s+/g, " ");
    }

    function normalizarCodigo(valor) {
        let texto = String(valor == null ? "" : valor).trim();
        if (texto === "") return "";
        if (/^-?\d+\.0+$/.test(texto)) texto = texto.replace(/\.0+$/, "");
        return texto;
    }

    function valorPorNombres(row, candidatos) {
        const wanted = candidatos.map(normalizarNombreCol);
        const key = Object.keys(row || {}).find(k => wanted.includes(normalizarNombreCol(k)));
        return key == null ? "" : row[key];
    }

    function limpiarCeldaTexto(valor) {
        return String(valor == null ? "" : valor)
            .replace(/[\u00A0\u200B-\u200D\uFEFF]/g, " ")
            .trim()
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/\s+/g, " ");
    }

    function filaEncabezadoConArea(worksheet) {
        if (!worksheet || !worksheet['!ref']) return 0;
        const range = XLSX.utils.decode_range(worksheet['!ref']);
        const maxR = Math.min(range.e.r, range.s.r + 12);
        for (let R = range.s.r; R <= maxR; R++) {
            for (let C = range.s.c; C <= range.e.c; C++) {
                const cell = worksheet[XLSX.utils.encode_cell({r: R, c: C})];
                if (!cell || cell.v == null) continue;
                if (normalizarNombreCol(cell.v) === "area") return R;
            }
        }
        return range.s.r;
    }

    function claveCombinacion(cargo, asignatura, especialidad) {
        return [
            normalizarCodigo(cargo),
            normalizarCodigo(asignatura),
            normalizarCodigo(especialidad)
        ].join("|");
    }

    function claveCombinacionDeFila(row) {
        return claveCombinacion(
            valorPorNombres(row, ["codigo cargo", "cod. cargo"]),
            valorPorNombres(row, ["codigo asignatura", "codigo de asignatura", "cod. asignatura"]),
            valorPorNombres(row, ["codigo especialidad", "codigo de especialidad", "cod. especialidad"])
        );
    }

    function cargarCatalogoCombinaciones(eqData) {
        const catalogo = new Set();
        if (!eqData || !eqData.length) return catalogo;

        const header = (eqData[0] || []).map(normalizarNombreCol);
        const idxCargo = header.findIndex(h => h === "codigo cargo" || h === "cod. cargo");
        const idxAsig = header.findIndex(h => h === "codigo asignatura" || h === "codigo de asignatura" || h === "cod. asignatura");
        const idxEsp = header.findIndex(h => h === "codigo especialidad" || h === "codigo de especialidad" || h === "cod. especialidad");

        const start = (idxCargo >= 0 && idxAsig >= 0 && idxEsp >= 0) ? 1 : 0;
        for (let i = start; i < eqData.length; i++) {
            const row = eqData[i] || [];
            let cargo, asig, esp;
            if (idxCargo >= 0 && idxAsig >= 0 && idxEsp >= 0) {
                cargo = row[idxCargo];
                asig = row[idxAsig];
                esp = row[idxEsp];
            } else {
                cargo = row[0];
                asig = row[1];
                esp = row[2];
            }
            const clave = claveCombinacion(cargo, asig, esp);
            if (clave === "||") continue;
            catalogo.add(clave);
        }
        return catalogo;
    }

    function aplicarFormatoFechasHoras(worksheet) {
        if (!worksheet || !worksheet['!ref']) return;
        const rangeObj = XLSX.utils.decode_range(worksheet['!ref']);
        for (let C = rangeObj.s.c; C <= rangeObj.e.c; ++C) {
            let cell = worksheet[XLSX.utils.encode_cell({c: C, r: 0})];
            if (cell && cell.v === 'TEMP_VACIA') cell.v = '';
        }

        let headers = {};
        for (let C = rangeObj.s.c; C <= rangeObj.e.c; ++C) {
            let cell = worksheet[XLSX.utils.encode_cell({c: C, r: 0})];
            if (cell && typeof cell.v === 'string' && cell.v !== '') {
                headers[cell.v] = C;
            }
        }

        const dateCols = ['FECHA DESDE', 'FECHA HASTA', 'FECHA PUBLICACION', 'FECHA APERTURA'];
        const timeCols = ['HORA PUBLICACION', 'HORA APERTURA'];
        for (let R = 1; R <= rangeObj.e.r; ++R) {
            dateCols.forEach(col => {
                let C = headers[col];
                if (C !== undefined) {
                    let cell = worksheet[XLSX.utils.encode_cell({c: C, r: R})];
                    if (cell && typeof cell.v === 'number') {
                        cell.t = 'n';
                        cell.z = 'dd/mm/yyyy';
                    }
                }
            });
            timeCols.forEach(col => {
                let C = headers[col];
                if (C !== undefined) {
                    let cell = worksheet[XLSX.utils.encode_cell({c: C, r: R})];
                    if (cell && typeof cell.v === 'number') {
                        cell.t = 'n';
                        cell.z = 'hh:mm';
                    }
                }
            });
        }
    }

    function descargarTexto(nombreArchivo, contenido) {
        const blob = new Blob([contenido], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = nombreArchivo;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function pedirEnPopup({ titulo, texto, modo }) {
        return new Promise((resolve) => {
            const overlay = document.getElementById('modalOverlay');
            document.getElementById('modalTitle').innerText = titulo;
            document.getElementById('modalText').innerText = texto;
            const modalError = document.getElementById('modalError');
            modalError.style.display = 'none';
            modalError.innerText = '';
            document.getElementById('modalTurnoFields').style.display = modo === 'turno' ? 'block' : 'none';
            document.getElementById('modalEqFields').style.display = (modo === 'equivalencias' || modo === 'catalogo') ? 'block' : 'none';
            document.getElementById('modalHorariosFields').style.display = modo === 'horarios' ? 'block' : 'none';

            const eqLabel = document.querySelector('label[for="fileEquivalencias"]');
            if (eqLabel) {
                eqLabel.innerText = modo === 'catalogo'
                    ? 'Catálogo de combinaciones (una hoja)'
                    : 'Control de Cargos y Espejado';
            }

            if (modo === 'turno') {
                document.getElementById('varianteTurno').value = 'manana';
            }
            if (modo === 'equivalencias' || modo === 'catalogo') {
                document.getElementById('fileEquivalencias').value = '';
            }
            if (modo === 'horarios') {
                document.getElementById('horaPublicacionAdultos').value = '10:00';
                document.getElementById('horaAperturaAdultos').value = '18:00';
            }

            overlay.classList.add('visible');

            document.getElementById('modalCancel').onclick = () => {
                cerrarModal();
                resolve(null);
            };

            document.getElementById('modalConfirm').onclick = () => {
                if (modo === 'turno') {
                    const valor = document.getElementById('varianteTurno').value;
                    cerrarModal();
                    resolve(valor);
                    return;
                }

                if (modo === 'horarios') {
                    const publicacion = parseHoraInput(document.getElementById('horaPublicacionAdultos').value);
                    const apertura = parseHoraInput(document.getElementById('horaAperturaAdultos').value);
                    if (!publicacion || !apertura) {
                        modalError.style.display = 'block';
                        modalError.innerText = 'Completá la hora de publicación y el comienzo de apertura.';
                        return;
                    }
                    cerrarModal();
                    resolve({ publicacion, apertura });
                    return;
                }

                const archivo = document.getElementById('fileEquivalencias').files[0] || null;
                if (!archivo) {
                    modalError.style.display = 'block';
                    modalError.innerText = modo === 'catalogo'
                        ? 'Tenés que cargar el catálogo de combinaciones para continuar.'
                        : 'Tenés que cargar la tabla de equivalencias para continuar.';
                    return;
                }
                cerrarModal();
                resolve(archivo);
            };
        });
    }

    async function procesarArchivo() {
        const fileInput = document.getElementById('fileInput');
        const statusDiv = document.getElementById('status');
        
        if (!fileInput.files.length) {
            statusDiv.innerText = "Por favor, selecciona el archivo base antes de procesar.";
            statusDiv.className = "error";
            return;
        }

        try {
            statusDiv.className = "";
            statusDiv.innerText = "Procesando...";

            const bitacora = [];
            const logPaso = (linea) => bitacora.push(linea);
            const archivoOrigen = fileInput.files[0] ? fileInput.files[0].name : "";
            logPaso("REGISTRO DE PROCESO - CONFECCIONAR ELEVE");
            logPaso("Archivo de origen: " + archivoOrigen);
            logPaso("");

            const dataBase = await readFileAsync(fileInput.files[0]);
            const wbBase = XLSX.read(dataBase, {type: 'array', cellStyles: true});
            
            let mapOldToNew = {};
            let validNewCodes = new Set();

            // --- 2. AGRUPAR HOJAS (EL FILTRO DE FONDO ROJO SE APLICA DESPUÉS, SEGÚN EL ÁREA) ---
            const redRowsBySheet = await getRedRowsBySheet(dataBase);
            let filasConDatos = [];
            wbBase.SheetNames.forEach(sheetName => {
                const worksheet = wbBase.Sheets[sheetName];
                let range = worksheet['!ref'] ? XLSX.utils.decode_range(worksheet['!ref']) : null;
                if (!range) return;
                const headerRow = filaEncabezadoConArea(worksheet);
                let sheetData = XLSX.utils.sheet_to_json(worksheet, { defval: "", blankrows: true, range: headerRow });
                const redRows = redRowsBySheet[sheetName] || redRowsBySheet["*"] || new Set();
                
                for(let R = headerRow + 1; R <= range.e.r; ++R) {
                    let isRed = redRows.has(R);
                    if (!isRed) {
                        for(let C = range.s.c; C <= range.e.c; ++C) {
                            let cell = worksheet[XLSX.utils.encode_cell({r: R, c: C})];
                            if (sheetJsCellIsRed(cell)) {
                                isRed = true;
                                break;
                            }
                        }
                    }
                    
                    let rowIdx = R - headerRow - 1;
                    if(sheetData[rowIdx]) {
                        let hasData = Object.values(sheetData[rowIdx]).some(v => String(v).trim() !== "");
                        if (hasData) filasConDatos.push({ row: sheetData[rowIdx], isRed });
                    }
                }
            });

            if (filasConDatos.length === 0) {
                statusDiv.className = "error";
                statusDiv.innerText = "El archivo está vacío o todas las filas fueron eliminadas.";
                return;
            }

            // --- VALIDACIÓN DE ÁREA Y BASE ---
            const filaConArea = filasConDatos.find(item => {
                const area = limpiarCeldaTexto(valorPorNombres(item.row, ["area"]));
                return area === "media"
                    || area === "tecnica"
                    || area === "artistica"
                    || area === "normales"
                    || area === "secundaria adultos"
                    || area === "educacion inicial"
                    || area === "educacion primaria"
                    || area === "curricular"
                    || area === "especial"
                    || area === "educacion especial"
                    || area === "servicios profesionales"
                    || area === "servicio profesional"
                    || area === "primaria adultos"
                    || area === "educacion primaria adultos"
                    || (area.includes("primaria") && area.includes("adulto"));
            }) || filasConDatos.find(item => limpiarCeldaTexto(valorPorNombres(item.row, ["area"])) !== "") || filasConDatos[0];
            let areaNormalizada = limpiarCeldaTexto(valorPorNombres(filaConArea.row, ["area"]));
            let baseValor = limpiarCeldaTexto(valorPorNombres(filaConArea.row, ["base/ascenso"]));

            let isInicial = areaNormalizada === "educacion inicial";
            let isPrimaria = areaNormalizada === "educacion primaria";
            let isCurricular = areaNormalizada === "curricular";
            let isEspecial = areaNormalizada === "especial" || areaNormalizada === "educacion especial";
            let isServiciosProf = areaNormalizada === "servicios profesionales" || areaNormalizada === "servicio profesional";
            let isPrimariaAdultos = areaNormalizada === "primaria adultos"
                || areaNormalizada === "educacion primaria adultos"
                || (areaNormalizada.includes("primaria") && areaNormalizada.includes("adulto"));
            let isMedia = areaNormalizada === "media";
            let isTecnica = areaNormalizada === "tecnica";
            let isArtistica = areaNormalizada === "artistica";
            let isNormales = areaNormalizada === "normales";
            let isSecundariaAdultos = areaNormalizada === "secundaria adultos"
                || (areaNormalizada.includes("secundaria") && areaNormalizada.includes("adulto"));
            let usaReglasMedia = isMedia || isTecnica || isArtistica;
            let usaReglasNormales = isNormales || isSecundariaAdultos;
            let usaBaseYAscenso = usaReglasMedia || usaReglasNormales;
            let usaReglasCurricular = isCurricular || isEspecial || isServiciosProf;
            let usaEquivalencias = isCurricular || isEspecial;
            let usaVaciarColumnas = usaReglasCurricular || isPrimariaAdultos;
            let conservaVacantesConFondo = isEspecial || isServiciosProf;
            let isAreaCatalogo = usaReglasMedia;
            let usaHorariosAdultos = isPrimariaAdultos || usaReglasNormales;
            const areaMostrada = isPrimaria ? "Educación Primaria"
                : isInicial ? "Educación Inicial"
                : isEspecial ? "Especial"
                : isServiciosProf ? "Servicios Profesionales"
                : isPrimariaAdultos ? "Primaria Adultos"
                : isSecundariaAdultos ? "Secundaria Adultos"
                : isNormales ? "Normales"
                : isTecnica ? "Tecnica"
                : isArtistica ? "Artistica"
                : isMedia ? "Media"
                : isCurricular ? "Curricular"
                : String(valorPorNombres(filaConArea.row, ["area"]) || "");
            logPaso("AREA leída: " + String(valorPorNombres(filaConArea.row, ["area"]) || "").trim());
            logPaso("Área identificada: " + areaMostrada);
            logPaso("BASE/ASCENSO de referencia: " + String(valorPorNombres(filaConArea.row, ["base/ascenso"]) || "").trim());
            logPaso("Filas con datos leídas: " + filasConDatos.length);

            if (!isInicial && !isPrimaria && !isCurricular && !isEspecial && !isServiciosProf && !isPrimariaAdultos && !usaReglasMedia && !usaReglasNormales) {
                statusDiv.className = "error";
                statusDiv.innerText = "TODAVIA NO TENEMOS ESTA AREA AUTOMATIZADA";
                return; 
            }

            if (!usaBaseYAscenso && baseValor !== "base") {
                statusDiv.className = "error";
                statusDiv.innerText = "TODAVIA NO TENEMOS ESTA AREA AUTOMATIZADA";
                return;
            }

            let jsonData = [];
            let filasRojasEliminadas = 0;
            filasConDatos.forEach(item => {
                if (item.isRed && !conservaVacantesConFondo) {
                    filasRojasEliminadas++;
                    return;
                }
                jsonData.push(item.row);
            });

            if (jsonData.length === 0) {
                statusDiv.className = "error";
                statusDiv.innerText = "El archivo está vacío o todas las filas fueron eliminadas.";
                return;
            }

            logPaso(conservaVacantesConFondo
                ? "Filtro de filas rojas: no se eliminan (área las conserva)."
                : "Filtro de filas rojas: se eliminaron " + filasRojasEliminadas + " filas.");
            logPaso("Vacantes que siguen en el proceso: " + jsonData.length);
            if (usaBaseYAscenso) logPaso("Se procesan Base y Ascenso.");
            else logPaso("Solo se procesa Base.");

            let varianteTurno = "manana";
            let horariosAdultos = null;
            if (isInicial || isPrimaria) {
                statusDiv.className = "";
                statusDiv.innerText = "Área detectada: " + (isPrimaria ? "Educación Primaria" : "Educación Inicial") + ". Elegí el turno.";
                varianteTurno = await pedirEnPopup({
                    titulo: isPrimaria ? "Educación Primaria" : "Educación Inicial",
                    texto: "El archivo corresponde a " + (isPrimaria ? "Primaria" : "Inicial") + ". Elegí si querés procesar la variante de Mañana o de Tarde.",
                    modo: "turno"
                });
                if (!varianteTurno) {
                    statusDiv.className = "";
                    statusDiv.innerText = "Proceso cancelado.";
                    return;
                }
                logPaso("Variante de turno elegida: " + (varianteTurno === "tarde" ? "Tarde" : "Mañana") + ".");
            }

            if (usaHorariosAdultos) {
                const nombreHorarios = isSecundariaAdultos ? "Secundaria Adultos" : (isNormales ? "Normales" : "Primaria Adultos");
                statusDiv.className = "";
                statusDiv.innerText = "Área detectada: " + nombreHorarios + ". Definí los horarios.";
                horariosAdultos = await pedirEnPopup({
                    titulo: nombreHorarios,
                    texto: "El archivo corresponde a " + nombreHorarios + ". Indicá la hora de publicación y el comienzo del horario de apertura. El resto de los cargos se van a ir corriendo de a " + (usaReglasNormales ? "5" : "10") + " minutos.",
                    modo: "horarios"
                });
                if (!horariosAdultos) {
                    statusDiv.className = "";
                    statusDiv.innerText = "Proceso cancelado.";
                    return;
                }
                logPaso("Horarios cargados: publicación " + horariosAdultos.publicacion.str + ", comienzo de apertura " + horariosAdultos.apertura.str + ", salto de " + (usaReglasNormales ? "5" : "10") + " minutos por cargo.");
            }

            if (usaEquivalencias) {
                const nombreAreaEq = isEspecial ? "Especial" : "Curricular";
                statusDiv.className = "";
                statusDiv.innerText = "Área detectada: " + nombreAreaEq + ". Cargá la tabla de equivalencias.";
                const archivoEq = await pedirEnPopup({
                    titulo: nombreAreaEq,
                    texto: "El archivo corresponde a " + nombreAreaEq + ". Seleccioná la tabla de equivalencias para continuar.",
                    modo: "equivalencias"
                });
                if (!archivoEq) {
                    statusDiv.className = "";
                    statusDiv.innerText = "Proceso cancelado.";
                    return;
                }

                const dataEq = await readFileAsync(archivoEq);
                const wbEq = XLSX.read(dataEq, {type: 'array'});
                let eqSheetName = wbEq.SheetNames[0];
                let eqData = XLSX.utils.sheet_to_json(wbEq.Sheets[eqSheetName], { header: 1 });

                for(let i = 1; i < eqData.length; i++) {
                    let row = eqData[i];
                    if(row && row.length >= 2) {
                        let oldC = String(row[0] || "").trim();
                        let newC = String(row[1] || "").trim();
                        if(oldC) mapOldToNew[oldC] = newC;
                        if(newC) validNewCodes.add(newC);
                    }
                }
                logPaso("Tabla de equivalencias: " + archivoEq.name + " (" + Object.keys(mapOldToNew).length + " reemplazos, " + validNewCodes.size + " códigos válidos).");
                if (usaVaciarColumnas) logPaso("Se vacían columnas de asignatura y especialidad.");
            }

            let catalogoCombinaciones = new Set();
            if (isAreaCatalogo) {
                const nombreAreaCat = isTecnica ? "Tecnica" : (isArtistica ? "Artistica" : "Media");
                statusDiv.className = "";
                statusDiv.innerText = "Área detectada: " + nombreAreaCat + ". Cargá el catálogo de combinaciones.";
                const archivoCat = await pedirEnPopup({
                    titulo: nombreAreaCat,
                    texto: "El archivo corresponde a " + nombreAreaCat + ". Seleccioná el Excel del catálogo (una hoja, coincidencia exacta de código de cargo, asignatura y especialidad).",
                    modo: "catalogo"
                });
                if (!archivoCat) {
                    statusDiv.className = "";
                    statusDiv.innerText = "Proceso cancelado.";
                    return;
                }

                const dataCat = await readFileAsync(archivoCat);
                const wbCat = XLSX.read(dataCat, {type: 'array'});
                const catSheetName = wbCat.SheetNames[0];
                const catData = XLSX.utils.sheet_to_json(wbCat.Sheets[catSheetName], { header: 1 });
                catalogoCombinaciones = cargarCatalogoCombinaciones(catData);
                if (catalogoCombinaciones.size === 0) {
                    statusDiv.className = "error";
                    statusDiv.innerText = "El catálogo no tiene combinaciones válidas. Revisá que la hoja tenga código de cargo, asignatura y especialidad.";
                    return;
                }
                logPaso("Catálogo de combinaciones: " + archivoCat.name + " (" + catalogoCombinaciones.size + " combinaciones exactas de cargo + asignatura + especialidad).");
            }

            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth();
            const currentDay = now.getDate();
            const esVarianteManana = varianteTurno !== "tarde";
            
            const dateHasta = getExcelDate(currentYear, 11, 31); 
            const dateActual = getExcelDate(currentYear, currentMonth, currentDay);

            let especialidad1081 = 0;
            let processedData = jsonData.map(row => {
                let newRow = {};
                
                newRow['TEMP_VACIA'] = ""; 
                
                Object.keys(row).forEach(key => {
                    if (!key.startsWith("__EMPTY") && key.trim() !== "") {
                        newRow[key] = row[key];
                    }
                });
                
                // --- REGLA: VACIAR COLUMNAS EN CURRICULAR / ESPECIAL / ADULTOS ---
                if (usaVaciarColumnas) {
                    const normalizarCol = (nombre) => String(nombre || "")
                        .trim()
                        .toLowerCase()
                        .normalize("NFD")
                        .replace(/[\u0300-\u036f]/g, "")
                        .replace(/\s+/g, " ");

                    const columnasABorrar = new Set([
                        "codigo asignatura",
                        "descripcion asignatura",
                        "codigo especialidad",
                        "descripcion especialidad"
                    ]);

                    Object.keys(newRow).forEach(key => {
                        if (columnasABorrar.has(normalizarCol(key))) {
                            newRow[key] = "";
                        }
                    });
                }

                // --- 3. REEMPLAZO Y CONTROL DE CÓDIGOS DE CARGO (CURRICULAR / ESPECIAL) ---
                let cargo = newRow['CODIGO CARGO'] ? String(newRow['CODIGO CARGO']).trim() : "";
                let nuevoCargo = cargo; // Por defecto es el mismo cargo
                
                if (usaEquivalencias) {
                    nuevoCargo = mapOldToNew[cargo] || cargo;
                    
                    // Convertimos el cargo a número para que quede con formato número en Excel
                    let numericCargo = Number(nuevoCargo);
                    newRow['CODIGO CARGO'] = (!isNaN(numericCargo) && String(nuevoCargo).trim() !== "") ? numericCargo : nuevoCargo;
                    
                    // Controlar usando el código como texto
                    if (!validNewCodes.has(String(nuevoCargo))) {
                        newRow['TEMP_VACIA'] = "CONTROLAR";
                    }
                } else if (isServiciosProf || usaReglasMedia || usaReglasNormales) {
                    let numericCargo = Number(nuevoCargo);
                    newRow['CODIGO CARGO'] = (!isNaN(numericCargo) && String(nuevoCargo).trim() !== "") ? numericCargo : nuevoCargo;
                } else if (isPrimariaAdultos) {
                    const cargosAdultos = { "1081": "1080", "691": "904" };
                    nuevoCargo = cargosAdultos[String(cargo)] || cargo;
                    let numericCargo = Number(nuevoCargo);
                    newRow['CODIGO CARGO'] = (!isNaN(numericCargo) && String(nuevoCargo).trim() !== "") ? numericCargo : nuevoCargo;
                } else {
                    // Para las demás áreas queda el código original y sin formato numérico
                    newRow['CODIGO CARGO'] = cargo; 
                }

                if (isSecundariaAdultos) {
                    const asignaturasEsp1081 = new Set(["1598","3422","4835","5620","6015","6095","6099","6107","6116","6125","6152","6169","6229"]);
                    const colAsig = Object.keys(newRow).find(k => ["codigo asignatura","codigo de asignatura","cod. asignatura"].includes(normalizarNombreCol(k)));
                    let colEsp = Object.keys(newRow).find(k => ["codigo especialidad","codigo de especialidad","cod. especialidad"].includes(normalizarNombreCol(k)));
                    if (!colEsp) colEsp = "CODIGO ESPECIALIDAD";
                    const asig = normalizarCodigo(colAsig ? newRow[colAsig] : "");
                    if (asignaturasEsp1081.has(asig)) {
                        newRow[colEsp] = 1081;
                        especialidad1081++;
                    }
                }

                if (isEspecial) {
                    let colDistrito = Object.keys(newRow).find(key => String(key).trim().toLowerCase() === "distrito") || "Distrito";
                    let distritoValor = newRow[colDistrito];
                    let distritoTexto = distritoValor == null ? "" : String(distritoValor).trim();
                    if (distritoTexto === "" || distritoTexto === "0") {
                        newRow[colDistrito] = 1;
                    }
                }

                let turno = newRow['TURNO'] ? String(newRow['TURNO']).trim() : "";
                if (turno.toLowerCase() === 'doble') {
                    turno = 'COMPLETO';
                    newRow['TURNO'] = turno;
                }
                
                let turnoLower = turno.toLowerCase();
                let isMananaOrCompleto = (turnoLower === "mañana" || turnoLower === "manana" || turnoLower === "completo");
                let isTarde = (turnoLower === "tarde");

                if (isPrimaria) {
                    if (String(nuevoCargo) !== "1020" && String(nuevoCargo) !== "1028") return null;
                    if (esVarianteManana && isTarde) return null;
                    if (!esVarianteManana && isMananaOrCompleto) return null;
                }

                // --- 4. CANT. HORAS ---
                let cantHoras = newRow['Cant. Horas'];
                if (!cantHoras || String(cantHoras).trim() === "") {
                    newRow['Cant. Horas'] = "1";
                } else {
                    let numero = parseFloat(String(cantHoras).replace(',', '.'));
                    if (!isNaN(numero)) {
                        newRow['Cant. Horas'] = String(Math.floor(numero)); 
                    } else {
                        newRow['Cant. Horas'] = "1";
                    }
                }

                if (!newRow['HORARIO A CUMPLIR'] || String(newRow['HORARIO A CUMPLIR']).trim() === "") {
                    newRow['HORARIO A CUMPLIR'] = ".";
                }

                let colDocente = newRow.hasOwnProperty('DOCENTE') ? 'DOCENTE' : 'Docente';
                if (!newRow[colDocente] || String(newRow[colDocente]).trim() === "") {
                    newRow[colDocente] = ".";
                }

                let colMotivo = newRow.hasOwnProperty('Motivo de la Vacante') ? 'Motivo de la Vacante' : 'Motivo de la vacante';
                if (!newRow[colMotivo] || String(newRow[colMotivo]).trim() === "") {
                    newRow[colMotivo] = ".";
                }

                // --- 5. NOVEDAD MAYOR A 60 DIAS ---
                let colNovedad = newRow.hasOwnProperty('Novedad Mayor 60 dias hábiles') 
                                 ? 'Novedad Mayor 60 dias hábiles' 
                                 : 'Novedad Mayor 60 dias habiles';

                if (isEspecial || isPrimariaAdultos || usaReglasMedia || usaReglasNormales) {
                    newRow[colNovedad] = "2";
                } else if (isPrimaria || isInicial || isServiciosProf) {
                    let novedad = newRow[colNovedad] ? String(newRow[colNovedad]).trim() : "";
                    let sitRev = newRow['Sit. Rev.'] ? String(newRow['Sit. Rev.']).toUpperCase() : "";

                    if (turnoLower === 'completo' && sitRev.includes('INTERINO')) {
                        newRow[colNovedad] = "1";
                    } else if (turnoLower === 'mañana' || turnoLower === 'manana' || turnoLower === 'tarde') {
                        newRow[colNovedad] = "2";
                    } else if (novedad === "1") {
                        newRow[colNovedad] = "1";
                    } else {
                        newRow[colNovedad] = "2";
                    }
                } else {
                    if (String(newRow['Cant. Horas']) === "32") {
                        newRow[colNovedad] = "1";
                    } else {
                        newRow[colNovedad] = "2";
                    }
                }

                let fDesde = newRow['FECHA DESDE'];
                if (typeof fDesde === 'string' && fDesde.trim() !== '') {
                    let parts = fDesde.split(/[-/]/);
                    if (parts.length === 3) {
                        let d = parseInt(parts[0], 10);
                        let m = parseInt(parts[1], 10) - 1;
                        let y = parseInt(parts[2], 10);
                        if (y < 100) y += 2000;
                        newRow['FECHA DESDE'] = getExcelDate(y, m, d);
                    }
                }

                newRow['FECHA HASTA'] = dateHasta;
                newRow['FECHA PUBLICACION'] = dateActual;
                newRow['FECHA APERTURA'] = dateActual;

                // --- 6. HORA PUBLICACION ---
                let horaPublicacionStr = "10:00";
                if (usaReglasMedia && normalizarCodigo(nuevoCargo) === "1582") {
                    horaPublicacionStr = "16:00";
                } else if ((isPrimariaAdultos || usaReglasNormales) && horariosAdultos) {
                    horaPublicacionStr = horariosAdultos.publicacion.str;
                } else if (isPrimaria) {
                    horaPublicacionStr = esVarianteManana ? "08:00" : "12:00";
                } else if (isInicial) {
                    horaPublicacionStr = esVarianteManana ? "09:30" : "13:00";
                }
                let pubParts = horaPublicacionStr.split(":").map(Number);
                newRow['HORA PUBLICACION'] = (pubParts[0] * 60 + pubParts[1]) / 1440;

                if (isPrimaria || isInicial) {
                    let haFrac = "";
                    let cargoApertura = String(nuevoCargo);

                    if (isPrimaria) {
                        if (horaPublicacionStr === "08:00") {
                            if (isMananaOrCompleto && cargoApertura === "1020") haFrac = (9 * 60 + 30) / 1440;
                            else if (isMananaOrCompleto && cargoApertura === "1028") haFrac = (9 * 60 + 45) / 1440;
                        } else if (horaPublicacionStr === "12:00") {
                            if (isTarde && cargoApertura === "1020") haFrac = (13 * 60) / 1440;
                            else if (isTarde && cargoApertura === "1028") haFrac = (13 * 60 + 15) / 1440;
                        }
                    } else {
                        if (horaPublicacionStr === "09:30") {
                            if (isMananaOrCompleto && cargoApertura === "1010") haFrac = (11 * 60) / 1440;
                            else if (isMananaOrCompleto && cargoApertura === "1018") haFrac = (11 * 60 + 15) / 1440;
                            else if (isTarde && cargoApertura === "1010") haFrac = (11 * 60 + 30) / 1440;
                            else if (isTarde && cargoApertura === "1018") haFrac = (11 * 60 + 45) / 1440;
                        } else if (horaPublicacionStr === "13:00") {
                            if (isMananaOrCompleto && cargoApertura === "1010") haFrac = (15 * 60) / 1440;
                            else if (isMananaOrCompleto && cargoApertura === "1018") haFrac = (15 * 60 + 15) / 1440;
                            else if (isTarde && cargoApertura === "1010") haFrac = (15 * 60 + 30) / 1440;
                            else if (isTarde && cargoApertura === "1018") haFrac = (15 * 60 + 45) / 1440;
                        }
                    }

                    if (haFrac !== "") {
                        newRow['HORA APERTURA'] = haFrac;
                    }
                }

                let colObs = newRow.hasOwnProperty('Observación') ? 'Observación' : 'observaciones';
                let obs = newRow[colObs] ? String(newRow[colObs]).trim() : "";
                if (/^\d+$/.test(obs)) {
                    newRow[colObs] = obs + ".";
                }

                return newRow;
            }).filter(row => row !== null);

            if (processedData.length === 0) {
                statusDiv.className = "error";
                statusDiv.innerText = "El archivo fue procesado, pero todas las vacantes fueron eliminadas según las reglas establecidas.";
                return;
            }

            // --- 7. ORDENAR POR CÓDIGO DE CARGO MAYOR A MENOR ---
            processedData.sort((a, b) => {
                let codeA = String(a['CODIGO CARGO'] || "");
                let codeB = String(b['CODIGO CARGO'] || "");
                
                let numA = parseInt(codeA, 10);
                let numB = parseInt(codeB, 10);
                
                if (!isNaN(numA) && !isNaN(numB)) {
                    if (numA !== numB) return numB - numA; 
                }
                
                if (codeA > codeB) return -1;
                if (codeA < codeB) return 1;
                return 0;
            });

            if (usaReglasMedia) {
                const tipoFila = (row) => {
                    const tipo = limpiarCeldaTexto(valorPorNombres(row, ["base/ascenso"]));
                    return tipo === "ascenso" ? "ascenso" : "base";
                };

                processedData.sort((a, b) => {
                    const tipoA = tipoFila(a);
                    const tipoB = tipoFila(b);
                    if (tipoA !== tipoB) return tipoA === "ascenso" ? -1 : 1;

                    let codeA = String(a['CODIGO CARGO'] || "");
                    let codeB = String(b['CODIGO CARGO'] || "");
                    let numA = parseInt(codeA, 10);
                    let numB = parseInt(codeB, 10);
                    if (!isNaN(numA) && !isNaN(numB) && numA !== numB) return numB - numA;
                    if (codeA !== codeB) return codeA > codeB ? -1 : 1;
                    const claveA = claveCombinacionDeFila(a);
                    const claveB = claveCombinacionDeFila(b);
                    if (claveA < claveB) return -1;
                    if (claveA > claveB) return 1;
                    return 0;
                });

                let minNormal = 18 * 60;
                let min1582 = 19 * 60 + 30;
                let lastNormal = null;
                let last1582 = null;
                processedData.forEach(row => {
                    const cargo = normalizarCodigo(valorPorNombres(row, ["codigo cargo", "cod. cargo"]));
                    const clave = tipoFila(row) + "|" + claveCombinacionDeFila(row);
                    if (cargo === "1582") {
                        row['HORA PUBLICACION'] = (16 * 60) / 1440;
                        if (last1582 !== null && clave !== last1582) min1582 += 5;
                        row['HORA APERTURA'] = min1582 / 1440;
                        last1582 = clave;
                    } else {
                        row['HORA PUBLICACION'] = (10 * 60) / 1440;
                        if (lastNormal !== null && clave !== lastNormal) minNormal += 5;
                        row['HORA APERTURA'] = minNormal / 1440;
                        lastNormal = clave;
                    }
                });
            } else if (isServiciosProf) {
                const horaApertura16 = (16 * 60) / 1440;
                processedData.forEach(row => {
                    row['HORA APERTURA'] = horaApertura16;
                });
            } else if ((isPrimariaAdultos || usaReglasNormales) && horariosAdultos) {
                if (usaReglasNormales) {
                    processedData.sort((a, b) => {
                        const tipoA = limpiarCeldaTexto(valorPorNombres(a, ["base/ascenso"])) === "ascenso" ? 0 : 1;
                        const tipoB = limpiarCeldaTexto(valorPorNombres(b, ["base/ascenso"])) === "ascenso" ? 0 : 1;
                        if (tipoA !== tipoB) return tipoA - tipoB;
                        let codeA = String(a['CODIGO CARGO'] || "");
                        let codeB = String(b['CODIGO CARGO'] || "");
                        let numA = parseInt(codeA, 10);
                        let numB = parseInt(codeB, 10);
                        if (!isNaN(numA) && !isNaN(numB) && numA !== numB) return numB - numA;
                        if (codeA > codeB) return -1;
                        if (codeA < codeB) return 1;
                        return 0;
                    });
                }
                let currentHoraApertura = horariosAdultos.apertura.minutes;
                let lastCode = null;

                processedData.forEach(row => {
                    let code = String(row['CODIGO CARGO']);
                    if (lastCode !== null && code !== lastCode) {
                        currentHoraApertura += usaReglasNormales ? 5 : 10;
                    }
                    row['HORA APERTURA'] = currentHoraApertura / 1440;
                    lastCode = code;
                });
            } else if (usaReglasCurricular) {
                let currentHoraApertura = 18 * 60; 
                let lastCode = null;

                processedData.forEach(row => {
                    let code = String(row['CODIGO CARGO']);
                    if (lastCode !== null && code !== lastCode) {
                        currentHoraApertura += 10; 
                    }
                    row['HORA APERTURA'] = currentHoraApertura / 1440;
                    lastCode = code;
                });
            }

            let filasOk = processedData;
            let filasSinCoincidencia = [];
            if (isAreaCatalogo) {
                filasOk = [];
                processedData.forEach(row => {
                    if (catalogoCombinaciones.has(claveCombinacionDeFila(row))) {
                        filasOk.push(row);
                    } else {
                        filasSinCoincidencia.push(row);
                    }
                });
            }

            const newWorksheet = filasOk.length ? XLSX.utils.json_to_sheet(filasOk) : null;
            const wsSinCoincidencia = filasSinCoincidencia.length ? XLSX.utils.json_to_sheet(filasSinCoincidencia) : null;
            if (newWorksheet) aplicarFormatoFechasHoras(newWorksheet);
            if (wsSinCoincidencia) aplicarFormatoFechasHoras(wsSinCoincidencia);

            const pad2 = (n) => String(n).padStart(2, "0");
            const slugArchivo = (texto) => String(texto || "")
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .replace(/[<>:"/\\|?*]/g, "")
                .trim()
                .replace(/\s+/g, "_")
                .replace(/_+/g, "_")
                .replace(/^_|_$/g, "");

            let areaNombre = isPrimaria ? "Primaria" : (isInicial ? "Inicial" : (isEspecial ? "Especial" : (isServiciosProf ? "Servicios_Profesionales" : (isPrimariaAdultos ? "Primaria_Adultos" : (isSecundariaAdultos ? "Secundaria_Adultos" : (isNormales ? "Normales" : (isTecnica ? "Tecnica" : (isArtistica ? "Artistica" : (isMedia ? "Media" : "Curricular")))))))));
            let tipoNombre = usaBaseYAscenso ? "Base_y_Ascenso" : (baseValor === "base" ? "Base" : (baseValor === "ascenso" ? "Ascenso" : String(jsonData[0]['BASE/ASCENSO'] || "Base")));
            const stamp = now.getFullYear() + "-" + pad2(currentMonth + 1) + "-" + pad2(currentDay)
                + "_" + pad2(now.getHours()) + "-" + pad2(now.getMinutes());

            const partesNombre = [areaNombre, tipoNombre];
            if (isPrimaria || isInicial) {
                partesNombre.push(esVarianteManana ? "Manana" : "Tarde");
            }
            partesNombre.push(stamp);
            const nombreDescarga = slugArchivo(partesNombre.join("_")) + ".xlsx";

            const newWorkbook = XLSX.utils.book_new();
            if (newWorksheet) XLSX.utils.book_append_sheet(newWorkbook, newWorksheet, "Datos Procesados");
            if (wsSinCoincidencia) XLSX.utils.book_append_sheet(newWorkbook, wsSinCoincidencia, "Sin coincidencia");
            XLSX.writeFile(newWorkbook, nombreDescarga);

            logPaso("");
            logPaso("REGLAS APLICADAS");
            if (isPrimaria) logPaso("- Primaria: se dejaron solo cargos 1020 y 1028 del turno elegido.");
            if (isInicial) logPaso("- Inicial: se filtró por la variante de turno elegida.");
            if (isPrimariaAdultos) logPaso("- Recodificación de cargos: 1081→1080 y 691→904.");
            if (isSecundariaAdultos) logPaso("- Secundaria Adultos: se puso especialidad 1081 en " + especialidad1081 + " filas según código de asignatura.");
            if (usaReglasMedia) {
                logPaso("- Publicación 10:00 (cargo 1582: 16:00).");
                logPaso("- Apertura desde 18:00 de a 5 minutos por combinación; primero Ascenso y después Base.");
                logPaso("- Cargo 1582: apertura desde 19:30 de a 5 minutos.");
            }
            if (usaReglasNormales) logPaso("- Apertura: primero Ascenso y después Base, de a 5 minutos por código de cargo.");
            if (isServiciosProf) logPaso("- Apertura fija a las 16:00.");
            if (usaReglasCurricular && !isServiciosProf) logPaso("- Apertura desde 18:00 de a 10 minutos por código de cargo.");
            if (isPrimariaAdultos) logPaso("- Apertura de a 10 minutos por código de cargo.");
            if (isEspecial) logPaso("- Distrito vacío o 0 se pasó a 1. Se conservaron filas rojas.");
            logPaso("- Vacantes resultantes: " + processedData.length + ".");
            if (isAreaCatalogo) {
                logPaso("- Coincidencias de catálogo: " + filasOk.length + ".");
                logPaso("- Sin coincidencia (hoja aparte): " + filasSinCoincidencia.length + ".");
            }
            logPaso("");
            logPaso("Archivo Excel: " + nombreDescarga);
            const nombreTxt = slugArchivo(partesNombre.join("_")) + "_proceso.txt";
            logPaso("Archivo de proceso: " + nombreTxt);
            logPaso("Fecha de proceso: " + now.toLocaleString("es-AR"));

            setTimeout(() => descargarTexto(nombreTxt, bitacora.join("\r\n") + "\r\n"), 500);

            if (window.PortalAuth && typeof PortalAuth.logProcessRun === 'function') {
                PortalAuth.logProcessRun({
                    module: 'eleves_acto',
                    moduleLabel: 'Eleves Acto Público',
                    procesador: 'confeccionar_eleve',
                    procesadorLabel: 'Confeccionar Eleve',
                    archivoOrigen: archivoOrigen,
                    archivoSalida: nombreDescarga,
                    filas: processedData.length,
                    area: areaNombre,
                    detalle: 'Tipo: ' + tipoNombre
                        + (isAreaCatalogo
                            ? ('; coincidencias ' + filasOk.length + '; sin coincidencia ' + filasSinCoincidencia.length)
                            : '')
                        + '; filas rojas eliminadas: ' + filasRojasEliminadas,
                    extras: {
                        tipo: tipoNombre,
                        filasRojasEliminadas: filasRojasEliminadas,
                        archivoProceso: nombreTxt
                    }
                });
            }

            statusDiv.className = "";
            const extraTxt = " También se descargó el detalle en " + nombreTxt + ".";
            if (isAreaCatalogo) {
                statusDiv.innerText = "¡Archivo procesado y descargado con éxito! Coincidencias: " + filasOk.length + ". Sin coincidencia: " + filasSinCoincidencia.length + ". Filas rojas eliminadas: " + filasRojasEliminadas + "." + extraTxt;
            } else {
                statusDiv.innerText = "¡Archivo procesado y descargado con éxito! Filas rojas eliminadas: " + filasRojasEliminadas + "." + extraTxt;
            }
            
        } catch (error) {
            console.error(error);
            statusDiv.className = "error";
            statusDiv.innerText = "Ocurrió un error al procesar el archivo. Revisa la consola para más detalles.";
        }
    }
</script>
