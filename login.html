<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal COREAP · Ingreso</title>
<link rel="icon" href="assets/favicon.png" type="image/png" sizes="32x32">
<link rel="icon" href="assets/favicon-48.png" type="image/png" sizes="48x48">
<link rel="shortcut icon" href="assets/favicon.ico">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<script src="portal-auth-gate.js?v=20260826-fastpages1"></script>
<script src="portal-theme.js"></script>
<link rel="stylesheet" href="portal-theme.css">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="auth-config.js"></script>
<script src="users-data.js?v=20260826-fastpages1"></script>
<script src="auth.js?v=20260904-roles1"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --az:var(--portal-az);--am:var(--portal-am);--cy:var(--portal-cy);--gr:var(--portal-gr);--gr-light:var(--portal-gr-light);
  --bg:var(--portal-bg);--surface:var(--portal-surface);--border:var(--portal-border);--error:var(--portal-error);
  --shadow:var(--portal-shadow-md);
  font-family:'Open Sans',sans-serif;
}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at top right,rgba(141,226,214,.18),transparent 40%),
             radial-gradient(circle at bottom left,rgba(255,204,0,.12),transparent 35%),
             var(--portal-bg);
  color:var(--portal-text);padding:24px;
}
.card{
  width:100%;max-width:440px;background:var(--portal-surface);border:1px solid var(--portal-border);
  border-radius:14px;box-shadow:var(--shadow);padding:28px 24px;border-top:4px solid var(--am);
}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px}
.brand h1{font-family:'Archivo',Georgia,serif;font-size:26px;color:#1d3343;line-height:1.2}
html[data-theme="dark"] .brand h1{color:#f2f5f7}
.theme-toggle{
  width:40px;height:40px;border-radius:8px;border:1px solid var(--border);
  background:transparent;cursor:pointer;font-size:18px;color:var(--gr);
}
#googleBtnHost{
  display:flex;justify-content:center;min-height:44px;
}
#googleBtnHost iframe{margin:0 auto !important}
.error{
  display:none;margin-top:14px;padding:10px 12px;border-radius:8px;
  background:rgba(185,28,28,.08);border:1px solid rgba(185,28,28,.25);
  color:var(--error);font-weight:600;font-size:13px;line-height:1.45;
}
.error.visible{display:block}
.footer-note{
  margin-top:22px;padding-top:16px;border-top:1px solid var(--border);
  font-size:12px;color:var(--gr-light);text-align:center;line-height:1.45;
}
</style>
<link rel="stylesheet" href="portal-obelisco.css"></head>
<body>
  <div class="card">
    <div class="brand">
      <h1>Portal COREAP</h1>
      <button type="button" class="theme-toggle" id="themeToggle" title="Cambiar tema">🌙</button>
    </div>

    <div id="googleBtnHost" aria-label="Iniciar sesión con Google"></div>
    <div class="error" id="errorBox"></div>
    <p class="footer-note">Portal dedicado al uso exclusivo de la COREAP</p>
  </div>

<script>
(function () {
  var errorBox = document.getElementById('errorBox');
  var clientId = PortalAuth.getGoogleClientId();
  var tries = 0;
  var host = document.getElementById('googleBtnHost');
  var loggingIn = false;

  function showBootError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('visible');
  }

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('visible');
  }

  function showStatus(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('visible');
    errorBox.style.background = 'rgba(0,150,136,.08)';
    errorBox.style.borderColor = 'rgba(0,150,136,.3)';
    errorBox.style.color = 'var(--gr)';
  }

  function clearStatusStyle() {
    errorBox.style.background = '';
    errorBox.style.borderColor = '';
    errorBox.style.color = '';
  }

  function goNext() {
    var params = new URLSearchParams(location.search);
    var next = params.get('next') || 'index.html';
    if (!/^[A-Za-z0-9._-]+\.html$/.test(next) || next === 'login.html') {
      next = 'index.html';
    }
    location.replace(next);
  }

  PortalTheme.initThemeToggle('themeToggle');

  function finishLogin(result) {
    clearStatusStyle();
    if (!result || !result.ok) {
      showError((result && result.error) || 'No se pudo iniciar sesión.');
      return;
    }
    goNext();
  }

  function handleCredential(response) {
    errorBox.classList.remove('visible');
    clearStatusStyle();
    if (!response || !response.credential) {
      showError('No se recibió la credencial de Google.');
      return;
    }
    showStatus('Ingresando…');
    loggingIn = true;
    PortalAuth.loginWithGoogleIdToken(response.credential).then(finishLogin);
  }

  function initGoogle() {
    if (!clientId) {
      showError('Falta configurar el Google Client ID.');
      return;
    }

    if (!window.google || !google.accounts || !google.accounts.id) {
      tries += 1;
      if (tries > 80) {
        showError('No se pudo cargar Google Sign-In.');
        return;
      }
      setTimeout(initGoogle, 100);
      return;
    }

    google.accounts.id.initialize({
      client_id: clientId,
      callback: handleCredential,
      auto_select: false,
      cancel_on_tap_outside: true,
      ux_mode: 'popup',
      context: 'signin',
      hosted_domain: PortalAuth.ALLOWED_DOMAIN
    });

    host.innerHTML = '';
    google.accounts.id.renderButton(host, {
      theme: 'outline',
      size: 'large',
      text: 'signin_with',
      shape: 'rectangular',
      width: Math.min(360, (host.parentElement && host.parentElement.clientWidth) || 360),
      locale: 'es'
    });
  }

  /* Mostrar el botón ya: no esperar sync de Firestore.
     Si ya hay sesión local, entrar; si no, pintar Google al instante. */
  try {
    if (PortalAuth.currentUser()) {
      goNext();
    } else {
      initGoogle();
    }
  } catch (e) {
    initGoogle();
  }

  /* Warm-up en background (no bloquea el botón) */
  PortalAuth.ready().then(function () {
    if (loggingIn) return;
    if (PortalAuth.currentUser()) goNext();
  }).catch(function (err) {
    console.error(err);
  });
})();
</script>
</body>
</html>
