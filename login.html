<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal COREAP · Ingreso</title>
<script>
(function () {
  try {
    var saved = localStorage.getItem('portal-theme')
      || localStorage.getItem('elevador-theme')
      || localStorage.getItem('procesador-theme');
    var theme = (saved === 'light' || saved === 'dark')
      ? saved
      : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>
<script src="auth-config.js"></script>
<script src="auth.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --az:#153244;--am:#FFCC00;--cy:#8DE2D6;--gr:#3C3C3B;--gr-light:#6b6b6a;
  --bg:#f0f2f4;--surface:#ffffff;--border:#e2e6ea;--error:#b91c1c;
  --shadow:0 10px 30px rgba(21,50,68,.12);
  font-family:'Source Sans 3',sans-serif;color-scheme:light;
}
html[data-theme="dark"]{
  --az:#8DE2D6;--gr:#e8eaed;--gr-light:#a8b0b8;--bg:#0f1a22;--surface:#172832;
  --border:#2a3d4a;--error:#f87171;--shadow:0 10px 30px rgba(0,0,0,.45);color-scheme:dark;
}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at top right,rgba(141,226,214,.18),transparent 40%),
             radial-gradient(circle at bottom left,rgba(255,204,0,.12),transparent 35%),
             var(--bg);
  color:var(--gr);padding:24px;
}
.card{
  width:100%;max-width:440px;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;box-shadow:var(--shadow);padding:32px 28px;border-top:4px solid var(--am);
}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}
.brand h1{font-family:'Source Serif 4',Georgia,serif;font-size:26px;color:#153244;line-height:1.2}
html[data-theme="dark"] .brand h1{color:#f2f5f7}
.brand p{font-size:12px;color:var(--gr-light);margin-top:4px;letter-spacing:.3px}
.theme-toggle{
  width:40px;height:40px;border-radius:8px;border:1px solid var(--border);
  background:transparent;cursor:pointer;font-size:18px;color:var(--gr);
}
.lead{font-size:15px;line-height:1.5;color:var(--gr);margin-bottom:18px}
.lead strong{color:#153244}
html[data-theme="dark"] .lead strong{color:#f2f5f7}

.btn-google{
  width:100%;display:flex;align-items:center;justify-content:center;gap:12px;
  padding:14px 16px;border-radius:10px;border:1px solid #dadce0;
  background:#fff;color:#3c4043;font-size:15px;font-weight:600;
  cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08);
}
.btn-google:hover{background:#f8f9fa;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.btn-google:disabled{opacity:.55;cursor:not-allowed}
.btn-google .g-icon{width:22px;height:22px;flex-shrink:0}
.btn-google b{color:#1a73e8}

#googleBtnHost{
  margin-top:12px;display:flex;justify-content:center;min-height:44px;
}
#googleBtnHost iframe{margin:0 auto !important}

.config-note,.error{
  display:none;margin-top:14px;padding:10px 12px;border-radius:8px;font-size:12px;line-height:1.45;
}
.config-note.visible,.error.visible{display:block}
.config-note{
  background:rgba(255,204,0,.15);border:1px solid rgba(255,204,0,.45);color:var(--gr);
}
.config-note code{font-size:11px}
.error{
  background:rgba(185,28,28,.08);border:1px solid rgba(185,28,28,.25);
  color:var(--error);font-weight:600;font-size:13px;
}
.footer-note{margin-top:18px;font-size:11px;color:var(--gr-light);text-align:center;line-height:1.5}
.hint{margin-top:10px;font-size:12px;color:var(--gr-light);line-height:1.45;text-align:center}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div>
        <h1>Portal COREAP</h1>
        <p>Acceso a la plataforma</p>
      </div>
      <button type="button" class="theme-toggle" id="themeToggle" title="Cambiar tema">🌙</button>
    </div>

    <p class="lead">¡Ingresá con tu cuenta para continuar!<br>
      Solo usuarios <strong>precargados</strong> con cuenta <strong>@bue.edu.ar</strong>.</p>

    <button type="button" class="btn-google" id="btnGoogle" disabled>
      <svg class="g-icon" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.5-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.2 6.1 29.4 4 24 4 16.1 4 9.2 8.5 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.3 35.9 26.8 37 24 37c-5.2 0-9.6-3.3-11.2-7.9l-6.5 5C9.1 39.5 16 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.5l.1.1 6.2 5.2C39.2 37.3 44 33 44 24c0-1.3-.1-2.5-.4-3.5z"/>
      </svg>
      <span>Ingresá con tu cuenta <b>@bue.edu.ar</b></span>
    </button>

    <div id="googleBtnHost" aria-label="Botón oficial de Google"></div>
    <p class="hint" id="originHint"></p>

    <div class="config-note" id="configNote">
      Para habilitar Google Sign-In, configurá el <code>googleClientId</code> en <code>auth-config.js</code>.
    </div>
    <div class="error" id="errorBox"></div>

    <p class="footer-note">Dirección de Carrera Docente · GCBA</p>
  </div>

<script>
(function () {
  PortalAuth.ensureSeed();

  var existing = PortalAuth.currentUser();
  if (existing) {
    location.replace('index.html');
    return;
  }

  var errorBox = document.getElementById('errorBox');
  var configNote = document.getElementById('configNote');
  var btnGoogle = document.getElementById('btnGoogle');
  var originHint = document.getElementById('originHint');
  var clientId = PortalAuth.getGoogleClientId();
  var tokenClient = null;
  var tries = 0;

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('visible');
  }

  function goNext() {
    var params = new URLSearchParams(location.search);
    var next = params.get('next') || 'index.html';
    if (!/^[A-Za-z0-9._-]+\.html$/.test(next)) next = 'index.html';
    location.replace(next);
  }

  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }
  function syncThemeToggle() {
    var btn = document.getElementById('themeToggle');
    if (!btn) return;
    var dark = currentTheme() === 'dark';
    btn.textContent = dark ? '☀️' : '🌙';
    btn.title = dark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro';
  }
  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    try {
      localStorage.setItem('portal-theme', theme);
      localStorage.setItem('elevador-theme', theme);
      localStorage.setItem('procesador-theme', theme);
    } catch (e) {}
    syncThemeToggle();
  }
  syncThemeToggle();
  document.getElementById('themeToggle').addEventListener('click', function () {
    setTheme(currentTheme() === 'dark' ? 'light' : 'dark');
  });

  if (location.protocol === 'file:') {
    showError('No abras el portal con file://. Usá un servidor local, por ejemplo: python3 -m http.server 8000 y entrá a http://localhost:8000/login.html');
  }

  originHint.textContent = 'Origen actual: ' + location.origin +
    ' — este valor debe estar en “Orígenes de JavaScript autorizados” del Client ID.';

  function finishLogin(result) {
    btnGoogle.disabled = false;
    if (!result.ok) {
      showError(result.error);
      return;
    }
    goNext();
  }

  function handleCredential(response) {
    errorBox.classList.remove('visible');
    if (!response || !response.credential) {
      showError('No se recibió la credencial de Google.');
      return;
    }
    btnGoogle.disabled = true;
    PortalAuth.loginWithGoogleIdToken(response.credential).then(finishLogin);
  }

  function handleAccessToken(tokenResponse) {
    errorBox.classList.remove('visible');
    if (!tokenResponse || !tokenResponse.access_token) {
      if (tokenResponse && tokenResponse.error) {
        showError('Google: ' + tokenResponse.error);
      } else {
        showError('No se recibió el acceso de Google.');
      }
      return;
    }
    btnGoogle.disabled = true;
    fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: { Authorization: 'Bearer ' + tokenResponse.access_token }
    })
      .then(function (res) {
        if (!res.ok) throw new Error('userinfo');
        return res.json();
      })
      .then(function (profile) {
        finishLogin(PortalAuth.loginWithGoogleProfile(profile));
      })
      .catch(function () {
        btnGoogle.disabled = false;
        showError('No se pudo obtener el perfil de Google. Revisá orígenes autorizados del Client ID.');
      });
  }

  function initGoogle() {
    if (!clientId) {
      configNote.classList.add('visible');
      btnGoogle.disabled = true;
      return;
    }

    if (!window.google || !google.accounts || !google.accounts.id) {
      tries += 1;
      if (tries > 80) {
        showError('No se pudo cargar Google Sign-In. Revisá la conexión o bloqueadores.');
        return;
      }
      setTimeout(initGoogle, 150);
      return;
    }

    google.accounts.id.initialize({
      client_id: clientId,
      callback: handleCredential,
      auto_select: false,
      cancel_on_tap_outside: true,
      ux_mode: 'popup',
      context: 'signin',
      // Preferir cuentas del dominio; si falla el picker, igual validamos @bue en auth.js
      hosted_domain: PortalAuth.ALLOWED_DOMAIN
    });

    // Botón oficial siempre visible (el método más confiable)
    var host = document.getElementById('googleBtnHost');
    host.innerHTML = '';
    google.accounts.id.renderButton(host, {
      theme: 'outline',
      size: 'large',
      text: 'signin_with',
      shape: 'rectangular',
      width: Math.min(360, host.parentElement.clientWidth || 360),
      locale: 'es'
    });

    // Botón custom: abre popup OAuth (alternativa al One Tap)
    if (google.accounts.oauth2 && google.accounts.oauth2.initTokenClient) {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: 'openid email profile',
        callback: handleAccessToken,
        error_callback: function (err) {
          showError((err && err.message) || 'No se pudo abrir el login de Google.');
        }
      });
    }

    btnGoogle.disabled = false;
    btnGoogle.addEventListener('click', function () {
      errorBox.classList.remove('visible');
      if (tokenClient) {
        tokenClient.requestAccessToken({ prompt: 'select_account' });
        return;
      }
      // Fallback: One Tap / account chooser
      google.accounts.id.prompt();
    });
  }

  initGoogle();
})();
</script>
</body>
</html>
