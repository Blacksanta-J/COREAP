<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal COREAP · Ingreso</title>
<link rel="icon" href="assets/favicon.png" type="image/png" sizes="32x32">
<link rel="icon" href="assets/favicon-48.png" type="image/png" sizes="48x48">
<link rel="shortcut icon" href="assets/favicon.ico">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<script src="portal-auth-gate.js"></script>
<script src="portal-theme.js"></script>
<link rel="stylesheet" href="portal-theme.css">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="auth-config.js"></script>
<script src="users-data.js?v=20260825-norest1"></script>
<script src="auth.js?v=20260825-lola1"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --az:var(--portal-az);--am:var(--portal-am);--cy:var(--portal-cy);--gr:var(--portal-gr);--gr-light:var(--portal-gr-light);
  --bg:var(--portal-bg);--surface:var(--portal-surface);--border:var(--portal-border);--error:var(--portal-error);
  --shadow:var(--portal-shadow-md);
  font-family:'Open Sans',sans-serif;
}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at top right,rgba(141,226,214,.18),transparent 40%),
             radial-gradient(circle at bottom left,rgba(255,204,0,.12),transparent 35%),
             var(--portal-bg);
  color:var(--portal-text);padding:24px;
}
.card{
  width:100%;max-width:440px;background:var(--portal-surface);border:1px solid var(--portal-border);
  border-radius:14px;box-shadow:var(--shadow);padding:28px 24px;border-top:4px solid var(--am);
}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px}
.brand h1{font-family:'Archivo',Georgia,serif;font-size:26px;color:#1d3343;line-height:1.2}
html[data-theme="dark"] .brand h1{color:#f2f5f7}
.theme-toggle{
  width:40px;height:40px;border-radius:8px;border:1px solid var(--border);
  background:transparent;cursor:pointer;font-size:18px;color:var(--gr);
}
.google-btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  min-height:44px;padding:10px 16px;border-radius:8px;cursor:pointer;
  border:1px solid #dadce0;background:#fff;color:#3c4043;
  font-family:'Open Sans',sans-serif;font-size:14px;font-weight:600;
}
.google-btn:hover{background:#f7f8f8;box-shadow:0 1px 2px rgba(60,64,67,.15)}
.google-btn:disabled{opacity:.65;cursor:wait}
.google-btn svg{width:18px;height:18px;flex-shrink:0}
html[data-theme="dark"] .google-btn{
  background:#1f2a32;border-color:var(--border);color:#e8eaed;
}
html[data-theme="dark"] .google-btn:hover{background:#26343d}
.error{
  display:none;margin-top:14px;padding:10px 12px;border-radius:8px;
  background:rgba(185,28,28,.08);border:1px solid rgba(185,28,28,.25);
  color:var(--error);font-weight:600;font-size:13px;line-height:1.45;
}
.error.visible{display:block}
.footer-note{
  margin-top:22px;padding-top:16px;border-top:1px solid var(--border);
  font-size:12px;color:var(--gr-light);text-align:center;line-height:1.45;
}
</style>
<link rel="stylesheet" href="portal-obelisco.css"></head>
<body>
  <div class="card">
    <div class="brand">
      <h1>Portal COREAP</h1>
      <button type="button" class="theme-toggle" id="themeToggle" title="Cambiar tema">🌙</button>
    </div>

    <button type="button" class="google-btn" id="googleLoginBtn" aria-label="Ingresá con Google">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Ingresá con Google
    </button>
    <div class="error" id="errorBox"></div>
    <p class="footer-note">Portal dedicado al uso exclusivo de la COREAP</p>
  </div>

<script>
(function () {
  var errorBox = document.getElementById('errorBox');
  var loginBtn = document.getElementById('googleLoginBtn');

  function showBootError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('visible');
  }

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('visible');
  }

  function goNext() {
    var params = new URLSearchParams(location.search);
    var next = params.get('next') || 'index.html';
    if (!/^[A-Za-z0-9._-]+\.html$/.test(next)) next = 'index.html';
    location.replace(next);
  }

  PortalTheme.initThemeToggle('themeToggle');

  function finishLogin(result) {
    if (!result || !result.ok) {
      showError((result && result.error) || 'No se pudo iniciar sesión.');
      loginBtn.disabled = false;
      return;
    }
    if (result.pending) return;
    goNext();
  }

  loginBtn.addEventListener('click', function () {
    errorBox.classList.remove('visible');
    loginBtn.disabled = true;
    PortalAuth.loginWithFirebaseGoogleRedirect().then(finishLogin);
  });

  PortalAuth.completeFirebaseRedirectLogin().then(function (redirectResult) {
    if (redirectResult) {
      finishLogin(redirectResult);
      return;
    }
    return PortalAuth.ready().then(function () {
      var existing = PortalAuth.currentUser();
      if (existing) {
        location.replace('index.html');
      }
    });
  }).catch(function (err) {
    console.error(err);
    showBootError('No se pudo inicializar el acceso. Reintentá.');
  });
})();
</script>
</body>
</html>
